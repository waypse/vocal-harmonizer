name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            pluginval: pluginval_Windows.zip
            pluginval_bin: ./pluginval.exe
          - name: Linux
            # Older Ubuntu so the plugin runs on more Linux versions.
            os: ubuntu-22.04
            pluginval: pluginval_Linux.zip
            pluginval_bin: xvfb-run -a ./pluginval

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libxi-dev libxrender-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          else
            cmake -B build
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Validate with pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/${{ matrix.pluginval }}"
          unzip -oq pluginval.zip
          ${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process \
            "build/VocalHarmonizer_artefacts/Release/VST3/Vocal Harmonizer.vst3"

      - uses: actions/upload-artifact@v4
        with:
          name: VocalHarmonizer-${{ matrix.name }}-VST3
          path: build/VocalHarmonizer_artefacts/Release/VST3/
